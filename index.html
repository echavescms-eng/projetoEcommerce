<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizu Express</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>
<!--   Cabeçalho site   --> 
    <header class="header">
        <div class="container header__content">
            <a class="header__logo" href="#">Bizu Express</a>

<!--  Botão do menu em dispositivos menores   --> 
            <button class="header__toggle" id="menuToggle" aria-label="Abrir menu" aria-expanded="false">
                ☰
            </button>
<!--   Opções de navegação   --> 
            <nav class="header__nav" id="menuNav">
                <a class="header__link header__link--active" href="#">Home</a>
                <a class="header__link" href="#">Produtos</a>
                <a class="header__link" href="#">Sobre</a>
                <a class="header__link" href="#">Contato</a>
            </nav>
        </div>
    </header>

<!--   Opções de produto no site  --> 
    <main>
        <section class="destaque">
            <h1>Bem-vindo à BizuExpress</h1>
        </section>

<!--  Carrocel de promoções   --> 
<div class="carrossel">
    <div class="slides" id="slides">
        <img src="assets/imagens/1.png" alt="Slide 1" />
        <img src="assets/imagens/2.png" alt="Slide 2" />
        <img src="assets/imagens/3.png" alt="Slide 3" />
    </div>

    <button class="btn prev" id="prev" aria-label="Anterior">&#10094;</button>
    <button class="btn next" id="next" aria-label="Próximo">&#10095;</button>
    </div>
        <section id="produtos" class="secao-produtos">
            <h2>Produtos</h2>
            <div id="lista-produtos" class="lista-produtos"></div>
        </section>
        
    </main>
<!--  Rodape do site   --> 
    <footer class="footer">
        <div class="container footer__content">
            <p class="footer__copy">&copy; 2026 Bizu Express. Todos os direitos reservados. Se mexer no código está sujeito a paulada</p>
            <nav class="footer__nav">
                <a class="footer__link" href="#">Termos de uso</a>
                <a class="footer__link" href="#">Privacidade</a>
                <a class="footer__link" href="#">Suporte</a>
            </nav>
        </div>
    </footer>

<!--  Script   --> 
<script src="js/script.js"></script>
</body>
</html>
