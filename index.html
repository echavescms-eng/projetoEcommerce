<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizu Express</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/carrosselformulario.css">
</head>
<body>
    <header class="header">
        <div class="container header__content">
            <a class="header__logo" href="#">Bizu Express</a>

            <button class="header__toggle" id="menuToggle" aria-label="Abrir menu" aria-expanded="false">
                ☰
            </button>

            <nav class="header__nav" id="menuNav">
                <a class="header__link header__link--active" href="#">Home</a>
                <a class="header__link" href="#">Produtos</a>
                <a class="header__link" href="#">Sobre</a>
                <a class="header__link" href="#">Contato</a>
            </nav>
        </div>
    </header>

    
    <script src="script.js"></script>
    
    <body>
        <main>
            <section class="destaque">
                <h1>Bem-vindo à BizuExpress</h1>
            </section>
        </main>
        <div class="pagina-produtos">
            <section class="pesquisa">
                <h1>Encontre tudo em um só lugar</h1>

                <form id="form-busca">
                <input
                    type="search"
                    id="input-busca"
                    class="campo-busca"
                    placeholder="O que você está procurando hoje?"
                    aria-label="Buscar produtos"
                >
                <button type="submit">Buscar</button>
                </form>
            </section>

        <div class="lista-produtos" id="lista-produtos"></div>
        </div>
        <main>
            <section id="produtos" class="secao-produtos">
                <h2>Produtos</h2>
                <div id="lista-produtos" class="lista-produtos"></div>
            </section>
        
        </main>
        
        <footer class="footer">
            <div class="container footer__content">
                <p class="footer__copy">&copy; 2026 Bizu Express. Todos os direitos reservados. Se mexer no código está sujeito a paulada</p>
                <nav class="footer__nav">
                    <a class="footer__link" href="#">Termos de uso</a>
                    <a class="footer__link" href="#">Privacidade</a>
                    <a class="footer__link" href="#">Suporte</a>
                </nav>
            </div>
        </footer>
        
  <script src="js/script.js"></script>
</body>
</html>
