<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bizu Express</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/carrosselformulario.css">
</head>

<body>
  <!-- Cabeçalho do site -->
  <header class="header">
    <div class="site-container header__content">
      <a class="header__logo" href="#">Bizu Express</a>

      <button
        class="header__toggle"
        id="menuToggle"
        type="button"
        aria-label="Abrir menu"
        aria-expanded="false"
        aria-controls="menuNav">

      </button>

      <nav class="header__nav" id="menuNav" aria-label="Navegação principal">
        <a class="header__link header__link--active" href="#">Home</a>
        <a class="header__link" href="#">Produtos</a>
        <a class="header__link" href="#">Sobre</a>
        <a class="header__link" href="#">Contato</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- Apresentação -->
    <section class="destaque">
      <div class="site-container">
        <h1>Bem-vindo à BizuExpress</h1>
      </div>
    </section>

    <!-- Carrossel de promoções -->
    <section class="carrossel" aria-label="Promoções">
      <div class="slides" id="slides">
        <img src="assets/imagens/1.png" alt="Promoção de micro-ondas">
        <img src="assets/imagens/2.png" alt="Promoção de cooktop elétrico">
        <img src="assets/imagens/3.png" alt="Promoção de liquidificador">
      </div>

      <button class="btn prev" id="prev" type="button" aria-label="Promoção anterior">
        &#10094;
      </button>

      <button class="btn next" id="next" type="button" aria-label="Próxima promoção">
        &#10095;
      </button>
    </section>

    <!-- Busca e lista de produtos -->
    <section id="produtos" class="secao-produtos">
      <div class="site-container">
        <h2>Produtos</h2>

        <div class="pagina-produtos">
          <section class="pesquisa" aria-label="Busca de produtos">
            <h3>Encontre tudo em um só lugar</h3>

            <form id="form-busca">
              <input
                type="search"
                id="input-busca"
                class="campo-busca"
                placeholder="O que você está procurando hoje?"
                aria-label="Buscar produtos"
              >
              <button type="submit">Buscar</button>
            </form>
          </section>

          <div class="lista-produtos" id="lista-produtos"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Rodapé do site -->
  <footer class="footer">
    <div class="site-container footer__content">
      <p class="footer__copy">
        &copy; 2026 Bizu Express. Todos os direitos reservados.
        Se mexer no código está sujeito a paulada.
      </p>

      <nav class="footer__nav" aria-label="Links do rodapé">
        <a class="footer__link" href="#">Termos de uso</a>
        <a class="footer__link" href="#">Privacidade</a>
        <a class="footer__link" href="#">Suporte</a>
      </nav>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
