<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrossel HTML</title>
  <style>
    .carrossel {
      position: relative;
      max-width: 600px;
      margin: 40px auto;
      overflow: hidden;
      border-radius: 8px;
    }

    .slides {
      display: flex;
      transition: transform 0.4s ease;
    }

    .slides img {
      width: 100%;
      flex-shrink: 0;
      display: block;
    }

    .btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: none;
      padding: 10px 14px;
      cursor: pointer;
    }

    .prev { left: 10px; }
    .next { right: 10px; }
  </style>
</head>
<body>
  <div class="carrossel">
    <div class="slides" id="slides">
      <img src="https://placeholder.com" alt="Slide 1" />
      <img src="https://placeholder.com" alt="Slide 2" />
      <img src="https://placeholder.com" alt="Slide 3" />
    </div>
    <button class="btn prev" id="prev" aria-label="Anterior">&#10094;</button>
    <button class="btn next" id="next" aria-label="Próximo">&#10095;</button>
  </div>

  <script>
    const slides = document.getElementById('slides');
    const total = slides.children.length;
    let index = 0;

    function atualizar() {
      slides.style.transform = `translateX(-${index * 100}%)`;
    }

    document.getElementById('next').addEventListener('click', () => {
      index = (index + 1) % total;
      atualizar();
    });

    document.getElementById('prev').addEventListener('click', () => {
      index = (index - 1 + total) % total;
      atualizar();
    });
  </script>
</body>
</html>
